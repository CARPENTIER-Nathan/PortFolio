<svg width="1100" height="500" viewBox="0 0 1100 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Les fonctionnalités clés de GIP2 : socle métier, interventions, planning, tableau de bord, rapports et application mobile">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#e9e4fd"/>
    </linearGradient>
    <linearGradient id="pilule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="ombre" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4c1d95" flood-opacity="0.14"/>
    </filter>
    <filter id="ombreDouce" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4c1d95" flood-opacity="0.12"/>
    </filter>

    <!-- Pictogrammes, dessinés dans un carré de 24 -->
    <g id="i-socle" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="9.5" width="8" height="12"/>
      <rect x="13.5" y="3.5" width="8" height="18"/>
      <path d="M5 13h3M5 17h3M16 7h3M16 11h3M16 15h3"/>
    </g>
    <g id="i-intervention" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2.2 2.2M16.8 16.8L19 19M19 5l-2.2 2.2M7.2 16.8L5 19"/>
    </g>
    <g id="i-planning" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2.5"/>
      <path d="M3 10h18M8 3v4M16 3v4"/>
      <path d="M8 14h2M14 14h2M8 18h2M14 18h2"/>
    </g>
    <g id="i-tableau" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 21h18"/>
      <rect x="4.5" y="12" width="4" height="7"/>
      <rect x="10" y="7" width="4" height="12"/>
      <rect x="15.5" y="14.5" width="4" height="4.5"/>
    </g>
    <g id="i-rapport" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2.5H6.5A1.5 1.5 0 0 0 5 4v16a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 20V7.5z"/>
      <path d="M14 2.5V7.5H19"/>
      <path d="M8.5 12.5h7M8.5 16h5"/>
    </g>
    <g id="i-mobile" fill="none" stroke="#7c3aed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="2.5" width="12" height="19" rx="2.5"/>
      <path d="M10.5 5.5h3"/>
      <circle cx="12" cy="18" r="1"/>
    </g>
  </defs>

  <rect width="1100" height="500" fill="url(#fond)"/>

  <!-- Titre -->
  <rect x="290" y="52" width="520" height="46" rx="23" fill="url(#pilule)"/>
  <text x="550" y="82" text-anchor="middle" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Les fonctionnalités clés de GIP2</text>

  <!-- Liaisons -->
  <g stroke="#c4b5fd" stroke-width="2" stroke-linecap="round">
    <path d="M470.7 218.4 L422.9 190.2"/>
    <path d="M458 265 L427 265"/>
    <path d="M470.7 311.6 L422.9 339.8"/>
    <path d="M629.3 218.4 L677.1 190.2"/>
    <path d="M642 265 L673 265"/>
    <path d="M629.3 311.6 L677.1 339.8"/>
  </g>

  <!-- Noyau -->
  <circle cx="550" cy="265" r="92" fill="#ffffff" filter="url(#ombre)"/>
  <text x="550" y="258" text-anchor="middle" font-family="Poppins, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#7c3aed">GIP2</text>
  <text x="550" y="286" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#6b7280">Gestion des interventions</text>
  <text x="550" y="303" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#6b7280">planifiées</text>

  <!-- Pastilles -->
  <g filter="url(#ombreDouce)">
    <rect x="375" y="153" width="44" height="44" rx="13" fill="#ffffff"/>
    <rect x="375" y="243" width="44" height="44" rx="13" fill="#ffffff"/>
    <rect x="375" y="333" width="44" height="44" rx="13" fill="#ffffff"/>
    <rect x="681" y="153" width="44" height="44" rx="13" fill="#ffffff"/>
    <rect x="681" y="243" width="44" height="44" rx="13" fill="#ffffff"/>
    <rect x="681" y="333" width="44" height="44" rx="13" fill="#ffffff"/>
  </g>

  <use href="#i-socle" transform="translate(385,163)"/>
  <use href="#i-intervention" transform="translate(385,253)"/>
  <use href="#i-planning" transform="translate(385,343)"/>
  <use href="#i-tableau" transform="translate(691,163)"/>
  <use href="#i-rapport" transform="translate(691,253)"/>
  <use href="#i-mobile" transform="translate(691,343)"/>

  <!-- Libellés de gauche -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937" text-anchor="end">
    <text x="345" y="169">Entités, clients, sites</text>
    <text x="345" y="191">et affaires</text>

    <text x="345" y="259">Interventions préventives</text>
    <text x="345" y="281">et correctives</text>

    <text x="345" y="349">Planning et calendrier</text>
    <text x="345" y="371">des interventions</text>
  </g>

  <!-- Libellés de droite -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#1f2937">
    <text x="755" y="169">Tableau de bord</text>
    <text x="755" y="191">et indicateurs de suivi</text>

    <text x="755" y="259">Saisie et rapports</text>
    <text x="755" y="281">d'intervention</text>

    <text x="755" y="349">Application mobile (PWA)</text>
    <text x="755" y="371">pour les techniciens</text>
  </g>
</svg>
